name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        type: string

jobs:
  build-macos:
    name: macOS archive (${{ matrix.feature.name }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        feature:
          - name: default
            trait_flag: ""
            suffix: ""
          - name: rsa
            trait_flag: "--traits RSA"
            suffix: "-rsa"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1.1"

      - name: Swift version
        run: swift --version

      - name: Build release binary
        shell: bash
        run: |
          if [[ -n "${{ matrix.feature.trait_flag }}" ]]; then
            swift build -c release --product ssh-client ${{ matrix.feature.trait_flag }}
          else
            swift build -c release --product ssh-client
          fi

      - name: Create archive
        shell: bash
        run: |
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ -n "${{ inputs.ref }}" ]]; then
            REF_NAME="${{ inputs.ref }}"
          fi
          ARCH="$(uname -m)"
          mkdir -p artifact
          cp .build/release/ssh-client artifact/
          tar czf "ssh-client-${REF_NAME}-macos-${ARCH}${{ matrix.feature.suffix }}.tar.gz" -C artifact ssh-client

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-macos-${{ matrix.feature.name }}
          path: ssh-client-*.tar.gz

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ssh-client-*.tar.gz

  build-linux:
    name: Linux archive (${{ matrix.feature.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        feature:
          - name: default
            trait_flag: ""
            suffix: ""
          - name: rsa
            trait_flag: "--traits RSA"
            suffix: "-rsa"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Swift version
        run: swift --version

      - name: Build release binary
        shell: bash
        run: |
          if [[ -n "${{ matrix.feature.trait_flag }}" ]]; then
            swift build -c release --product ssh-client ${{ matrix.feature.trait_flag }}
          else
            swift build -c release --product ssh-client
          fi

      - name: Create archive
        shell: bash
        run: |
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ -n "${{ inputs.ref }}" ]]; then
            REF_NAME="${{ inputs.ref }}"
          fi
          ARCH="$(uname -m)"
          mkdir -p artifact
          cp .build/release/ssh-client artifact/
          tar czf "ssh-client-${REF_NAME}-linux-${ARCH}${{ matrix.feature.suffix }}.tar.gz" -C artifact ssh-client

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-linux-${{ matrix.feature.name }}
          path: ssh-client-*.tar.gz

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ssh-client-*.tar.gz
