name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-macos:
    name: macOS (${{ matrix.feature.name }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        feature:
          - name: default
            trait_flag: ""
          - name: rsa
            trait_flag: "--traits RSA"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1.1"

      - name: Swift version
        run: swift --version

      - name: Build
        shell: bash
        run: |
          if [[ -n "${{ matrix.feature.trait_flag }}" ]]; then
            swift build --build-tests ${{ matrix.feature.trait_flag }}
          else
            swift build --build-tests
          fi

      - name: Run tests
        shell: bash
        run: |
          if [[ -n "${{ matrix.feature.trait_flag }}" ]]; then
            swift test ${{ matrix.feature.trait_flag }}
          else
            swift test
          fi

  build-and-test-linux:
    name: Ubuntu 24.04 (${{ matrix.feature.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        feature:
          - name: default
            trait_flag: ""
          - name: rsa
            trait_flag: "--traits RSA"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Swift version
        run: swift --version

      - name: Build
        shell: bash
        run: |
          if [[ -n "${{ matrix.feature.trait_flag }}" ]]; then
            swift build --build-tests ${{ matrix.feature.trait_flag }}
          else
            swift build --build-tests
          fi

      - name: Run tests
        shell: bash
        run: |
          if [[ -n "${{ matrix.feature.trait_flag }}" ]]; then
            swift test ${{ matrix.feature.trait_flag }}
          else
            swift test
          fi
